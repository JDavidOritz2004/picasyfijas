<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Picas y Fijas</title>
<style>
  body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
  .panel { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
  table { width: 100%; }
</style>
</head>
<body>
  <h1>Picas y Fijas</h1>
  <p id="msg"></p>

  <div class="panel">
    <h3>1. Tu nombre</h3>
    <input id="nombre" placeholder="Nombre">
    <button onclick="entrar()">Entrar</button>
  </div>

  <div class="panel" id="p2" hidden>
    <h3>2. Tu número secreto (4 cifras distintas)</h3>
    <input id="secreto" maxlength="4">
    <button onclick="crear()">Crear juego</button>
    <p>Para unirte a un juego, escribe tu número aquí y pulsa "Unirme" en la lista.</p>
  </div>

  <div class="panel" id="p3" hidden>
    <h3>3. Juegos</h3>
    <div id="lista"></div>
  </div>

  <div class="panel" id="p4" hidden>
    <h3 id="titulo"></h3>
    <p id="turno"></p>
    <input id="intento" maxlength="4" placeholder="Tu intento">
    <button onclick="jugar()">Probar</button>
    <table>
      <tr><th>Jugador</th><th>Intento</th><th>Fijas</th><th>Picas</th></tr>
      <tbody id="historial"></tbody>
    </table>
  </div>

<script>
const $ = id => document.getElementById(id);
let yo = "";        // mi nombre
let actual = null;  // id del juego que estoy viendo

// Llama al servidor y, si responde con error, lo muestra en pantalla
async function api(metodo, url, cuerpo) {
  const r = await fetch(url, {
    method: metodo,
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(cuerpo)
  });
  const d = await r.json();
  if (!r.ok) { $("msg").textContent = "Error: " + d.detail; throw d.detail; }
  return d;
}

async function entrar() {
  const d = await api("POST", "/login", {nombre: $("nombre").value});
  yo = d.nombre;
  $("msg").textContent = "Jugando como " + yo;
  $("p2").hidden = false;
  $("p3").hidden = false;
  listar();
}

async function crear() {
  const j = await api("POST", "/juego", {nombre: yo, numero: $("secreto").value});
  ver(j.id);
}

async function unirse(id) {
  await api("PUT", "/juego/" + id, {nombre: yo, numero: $("secreto").value});
  ver(id);
}

async function listar() {
  const juegos = await fetch("/juego").then(r => r.json());
  $("lista").innerHTML = juegos.map(j => `
    <p>#${j.id} - creado por ${j.creador} (${j.estado})${j.ganador ? " - ganó " + j.ganador : ""}
      ${j.estado === "por_iniciar" && j.creador !== yo ? `<button onclick="unirse(${j.id})">Unirme</button>` : ""}
      <button onclick="ver(${j.id})">Ver</button>
    </p>`).join("");
}

async function ver(id) {
  actual = id;
  const j = await fetch("/juego/" + id).then(r => r.json());
  $("p4").hidden = false;
  $("titulo").textContent = "Juego #" + j.id + ": " + j.creador + " contra " + (j.jugador2 || "(sin rival)");
  if (j.estado === "por_iniciar") $("turno").textContent = "Esperando a que otro jugador se una.";
  else if (j.estado === "terminado") $("turno").textContent = "Terminó. Ganó " + j.ganador + ".";
  else $("turno").textContent = "Turno de " + j.turno + ".";
  $("historial").innerHTML = j.historial.map(h =>
    `<tr><td>${h.jugador}</td><td>${h.intento}</td><td>${h.fijas}</td><td>${h.picas}</td></tr>`).join("");
}

async function jugar() {
  const r = await api("POST", "/juego/" + actual + "/jugar", {nombre: yo, numero: $("intento").value});
  $("intento").value = "";
  $("msg").textContent = r.ganador ? "¡Ganó " + r.ganador + "!" : r.fijas + " fijas y " + r.picas + " picas.";
  ver(actual);
}

// Cada 3 segundos se actualiza la lista y el juego abierto
setInterval(() => { if (yo) { listar(); if (actual) ver(actual); } }, 3000);
</script>
</body>
</html>
